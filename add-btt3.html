<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同意 BCC1 协议</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", sans-serif;
      background: #0e1116;
      color: #f4f1ea;
    }
    main {
      width: min(520px, calc(100% - 32px));
      padding: 28px 24px;
      border: 1px solid #ffffff22;
      border-radius: 12px;
      background: #171c24;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 14px; color: #c8c2b6; line-height: 1.55; }
    code { color: #f4e3b2; word-break: break-all; }
    button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: #f0d78c;
      color: #1a1408;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #result {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #10141b;
      line-height: 1.55;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>同意 BCC1 协议</h1>
    <p>
      合约 <code>0x7eAeCE32c38f4631D5317e3FE145ceeAE6B73209</code>（BNB Chain）。
      点下面的按钮后，小狐狸会弹出一笔交易，调用 <code>acceptAgreement()</code>。
      你可以在弹窗里同意，也可以拒绝。同意只会把你的地址记成已接受协议，需要付一点 BNB 矿工费。
    </p>
    <button id="accept" type="button">连接钱包并选择是否同意</button>
    <div id="result">还没有连接。</div>
  </main>
  <script>
    const CONTRACT = "0x7eAeCE32c38f4631D5317e3FE145ceeAE6B73209";
    const ACCEPT = "0xdac96d4a";
    const HAS_ACCEPTED = "0x69b4d6fe";
    const BSC = {
      chainId: "0x38",
      chainName: "BNB Smart Chain",
      nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
      rpcUrls: ["https://bsc-dataseed.binance.org"],
      blockExplorerUrls: ["https://bscscan.com"],
    };
    const button = document.getElementById("accept");
    const result = document.getElementById("result");

    function padAddress(address) {
      return address.toLowerCase().replace("0x", "").padStart(64, "0");
    }

    async function alreadyAccepted(eth, account) {
      const raw = await eth.request({
        method: "eth_call",
        params: [{ to: CONTRACT, data: HAS_ACCEPTED + padAddress(account) }, "latest"],
      });
      return BigInt(raw) !== 0n;
    }

    button.onclick = async () => {
      const eth = window.ethereum;
      if (!eth) {
        result.textContent = "没有检测到 MetaMask。请用已安装小狐狸的 Chrome 或 Edge 打开。";
        return;
      }
      button.disabled = true;
      try {
        const accounts = await eth.request({ method: "eth_requestAccounts" });
        const account = accounts[0];
        try {
          await eth.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: BSC.chainId }],
          });
        } catch (err) {
          if (err && err.code === 4902) {
            await eth.request({ method: "wallet_addEthereumChain", params: [BSC] });
          } else {
            result.textContent = "已取消切换到 BNB Chain。";
            return;
          }
        }

        if (await alreadyAccepted(eth, account)) {
          result.textContent = account + "\n这个地址已经同意过协议。";
          return;
        }

        const tx = await eth.request({
          method: "eth_sendTransaction",
          params: [{ from: account, to: CONTRACT, data: ACCEPT }],
        });
        result.textContent = account + "\n已提交同意交易。\n" + tx;
      } catch (err) {
        if (err && err.code === 4001) {
          result.textContent = "你在小狐狸里拒绝了这笔交易。";
          return;
        }
        result.textContent = (err && err.message) ? err.message : "操作已取消。";
      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
