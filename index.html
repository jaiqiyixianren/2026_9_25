<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同意 BCC1 协议</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", sans-serif;
      background: #0e1116;
      color: #f4f1ea;
    }
    main {
      width: min(520px, calc(100% - 32px));
      padding: 28px 24px;
      border: 1px solid #ffffff22;
      border-radius: 12px;
      background: #171c24;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 14px; color: #c8c2b6; line-height: 1.55; }
    code { color: #f4e3b2; word-break: break-all; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button, a.choice {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: #f0d78c;
      color: #1a1408;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    button.alt, a.choice.alt { background: #111; color: #f4f1ea; border: 1px solid #ffffff33; }
    button:disabled, a.choice.disabled { opacity: 0.6; cursor: wait; pointer-events: none; }
    #result {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #10141b;
      line-height: 1.55;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>同意 BCC1 协议</h1>
    <p>
      合约 <code>0x7eAeCE32c38f4631D5317e3FE145ceeAE6B73209</code>（BNB Chain）。
      电脑上会直接唤起浏览器插件。手机上会先打开对应的钱包 App，并在 App 里重新打开这个网页，然后再弹出交易。调用的仍是 <code>acceptAgreement()</code>。
      你可以在弹窗里同意，也可以拒绝。同意只会把你的地址记成已接受协议，需要付一点 BNB 矿工费。
    </p>
    <div class="choices">
      <a id="metamask" class="choice" href="#">使用小狐狸</a>
      <a id="okx" class="choice alt" href="#">使用 OKX</a>
    </div>
    <div id="result">还没有连接。</div>
  </main>
  <script>
    const CONTRACT = "0x7eAeCE32c38f4631D5317e3FE145ceeAE6B73209";
    const ACCEPT = "0xdac96d4a";
    const HAS_ACCEPTED = "0x69b4d6fe";
    const BSC = {
      chainId: "0x38",
      chainName: "BNB Smart Chain",
      nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
      rpcUrls: ["https://bsc-dataseed.binance.org"],
      blockExplorerUrls: ["https://bscscan.com"],
    };
    const result = document.getElementById("result");
    const buttons = [document.getElementById("metamask"), document.getElementById("okx")];
    const announced = new Map();

    window.addEventListener("eip6963:announceProvider", (event) => {
      const detail = event.detail || {};
      const info = detail.info || {};
      if (info.rdns && detail.provider) announced.set(info.rdns, detail.provider);
    });
    window.dispatchEvent(new Event("eip6963:requestProvider"));

    function findAnnounced(match) {
      for (const [rdns, provider] of announced) {
        if (match(rdns)) return provider;
      }
      return null;
    }

    function providerList() {
      const eth = window.ethereum;
      const list = [];
      if (eth && Array.isArray(eth.providers)) list.push.apply(list, eth.providers);
      if (eth) list.push(eth);
      return list;
    }

    function getMetaMask() {
      const found = findAnnounced((rdns) => rdns === "io.metamask" || rdns === "io.metamask.flask");
      if (found) return found;
      return providerList().find((p) => p && p.isMetaMask && !p.isOkxWallet && !p.isOkx) || null;
    }

    function getOkx() {
      const found = findAnnounced((rdns) => /okx|okex/i.test(rdns));
      if (found) return found;
      const okx = window.okxwallet;
      if (okx && typeof okx.request === "function") return okx;
      if (okx && okx.ethereum && typeof okx.ethereum.request === "function") return okx.ethereum;
      return providerList().find((p) => p && (p.isOkxWallet || p.isOkx || p.isOKExWallet)) || null;
    }

    function isMobile() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function pageUrl() {
      return window.location.href.split("#")[0];
    }

    function isPrivateHost(hostname) {
      if (hostname === "localhost" || hostname === "127.0.0.1") return true;
      if (/^192\.168\./.test(hostname) || /^10\./.test(hostname)) return true;
      const match = /^172\.(\d+)\./.exec(hostname);
      return !!(match && Number(match[1]) >= 16 && Number(match[1]) <= 31);
    }

    function walletHref(kind) {
      const current = pageUrl();
      const hostAndPath = current.replace(/^https?:\/\//, "");
      if (kind === "okx") {
        const deeplink = "okx://wallet/dapp/url?dappUrl=" + encodeURIComponent(current);
        return "https://www.okx.com/download?deeplink=" + encodeURIComponent(deeplink);
      }
      return "https://metamask.app.link/dapp/" + hostAndPath;
    }

    function padAddress(address) {
      return address.toLowerCase().replace("0x", "").padStart(64, "0");
    }

    async function alreadyAccepted(eth, account) {
      const raw = await eth.request({
        method: "eth_call",
        params: [{ to: CONTRACT, data: HAS_ACCEPTED + padAddress(account) }, "latest"],
      });
      return BigInt(raw) !== 0n;
    }

    async function connect(kind) {
      window.dispatchEvent(new Event("eip6963:requestProvider"));
      await new Promise((resolve) => setTimeout(resolve, 60));
      const walletName = kind === "okx" ? "OKX" : "小狐狸";
      const eth = kind === "okx" ? getOkx() : getMetaMask();
      if (!eth) {
        if (isMobile()) {
          result.textContent = "正在打开" + walletName + "。进入 App 里的这个网页后，再点一次同一个按钮。";
          window.location.href = walletHref(kind);
          return;
        }
        result.textContent = "没有检测到" + walletName + "。请用已安装该插件的 Chrome 或 Edge 打开。";
        return;
      }
      buttons.forEach((btn) => { btn.classList.add("disabled"); });
      try {
        const accounts = await eth.request({ method: "eth_requestAccounts" });
        const account = accounts[0];
        try {
          await eth.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: BSC.chainId }],
          });
        } catch (err) {
          if (err && err.code === 4902) {
            await eth.request({ method: "wallet_addEthereumChain", params: [BSC] });
          } else {
            result.textContent = "已在" + walletName + "里取消切换到 BNB Chain。";
            return;
          }
        }

        if (await alreadyAccepted(eth, account)) {
          result.textContent = walletName + "\n" + account + "\n这个地址已经同意过协议。";
          return;
        }

        const tx = await eth.request({
          method: "eth_sendTransaction",
          params: [{ from: account, to: CONTRACT, data: ACCEPT }],
        });
        result.textContent = walletName + "\n" + account + "\n已提交同意交易。\n" + tx;
      } catch (err) {
        if (err && err.code === 4001) {
          result.textContent = "你在" + walletName + "里拒绝了这笔交易。";
          return;
        }
        result.textContent = (err && err.message) ? err.message : "操作已取消。";
      } finally {
        buttons.forEach((btn) => { btn.classList.remove("disabled"); });
      }
    }

    const metamaskLink = document.getElementById("metamask");
    const okxLink = document.getElementById("okx");
    metamaskLink.href = walletHref("metamask");
    okxLink.href = walletHref("okx");

    function onChoose(event, kind) {
      const eth = kind === "okx" ? getOkx() : getMetaMask();
      if (!eth && isMobile()) return;
      event.preventDefault();
      connect(kind);
    }
    metamaskLink.addEventListener("click", (event) => onChoose(event, "metamask"));
    okxLink.addEventListener("click", (event) => onChoose(event, "okx"));
  </script>
</body>
</html>
